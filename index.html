<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mini HTML Runner — made by praggie</title>
  <meta http-equiv="X-UA-Compatible" content="IE=5; IE=8; IE=9; IE=10; IE=11" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* === 1999 vibes === */
    html, body { height:100%; }
    body {
      margin:0;
      background: repeating-linear-gradient(45deg, #e9ecef, #e9ecef 6px, #f7f7f7 6px, #f7f7f7 12px);
      color:#111;
      font-family:"Times New Roman", Times, Georgia, serif;
      cursor: crosshair;
    }
    a { color:#0000EE; }
    a:visited { color:#551A8B; }

    .wrap { width: 760px; margin: 16px auto; }
    table.layout { width: 100%; border-collapse: collapse; background:#fff; border: 2px solid #808080; }
    td.header { background:#003399; color:#fff; font-weight:bold; padding:6px 10px; border-bottom: 2px solid #000; }
    .badge { font-size:12px; background:#ffcc33; color:#000; padding:2px 6px; border:1px solid #000; margin-left:6px; vertical-align: middle; text-transform: lowercase; }
    .marquee { background:#ffffcc; border-top:1px solid #999; border-bottom:1px solid #999; color:#000; padding:3px 6px; font-size:13px; }
    td.body { padding:10px; }

    .label { font-weight:bold; margin-bottom:6px; font-size:14px; }
    textarea {
      width:100%; height:60vh; resize:vertical; padding:8px;
      font-family:"Courier New", Courier, monospace; font-size:13px;
      background:#fffff7; color:#000; border:2px inset #c0c0c0; outline:none;
    }
    .hint { font-size:12px; color:#333; margin-top:4px; }

    /* Win98-style buttons */
    .btn {
      font-family: "MS Sans Serif", Tahoma, Verdana, sans-serif;
      font-size:13px; padding:4px 12px; background:#c0c0c0;
      border:2px solid; border-color:#fff #404040 #404040 #fff;
      color:#000; cursor:pointer; margin-right:6px; min-width: 90px;
    }
    .btn:active { border-color:#404040 #fff #fff #404040; padding:5px 11px 3px 13px; }
    .btn-primary { background:#dcdcdc; }
    .toolbar { margin-top:8px; padding:6px; background:#e5e5e5; border:2px outset #c0c0c0; }

    .footer { text-align:center; font-size:12px; color:#222; padding:8px 0; }
    kbd { border:1px solid #000; padding:0 3px; font-family:"Courier New", monospace; background:#eee; }
  </style>
</head>
<body>
  <div class="wrap">
    <table class="layout">
      <tr>
        <td class="header">
          Mini HTML Runner <span class="badge">made by praggie</span>
        </td>
      </tr>
      <tr><td class="marquee">
        <marquee scrollamount="4" behavior="scroll" direction="left">
          Type HTML below or click Random for a retro mini-game. <kbd>Ctrl</kbd>/<kbd>Cmd</kbd> + <kbd>Enter</kbd> runs instantly. Allow pop-ups.
        </marquee>
      </td></tr>
      <tr>
        <td class="body">
          <div class="label">Your HTML:</div>
          <textarea id="editor" spellcheck="false" placeholder="Let's code"></textarea>
          <div class="hint">Autosaves to your browser. Use Reset to clear.</div>

          <div class="toolbar">
            <input type="button" class="btn btn-primary" id="runBtn" value="▶ RUN (new tab)">
            <input type="button" class="btn" id="randomBtn" value="❖ Random (retro game)">
            <input type="button" class="btn" id="downloadBtn" value="⤓ Download .html">
            <input type="button" class="btn" id="resetBtn" value="↺ Reset">
            <input type="button" class="btn" id="insertTemplateBtn" value="+ Insert template">
          </div>
        </td>
      </tr>
      <tr><td class="footer">
        © 1998–2003 — Best viewed in 800×600 with Internet Explorer 5.5 or Netscape 4.7
      </td></tr>
    </table>
  </div>

  <script>
    const editor = document.getElementById('editor');
    const runBtn = document.getElementById('runBtn');
    const resetBtn = document.getElementById('resetBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const insertTemplateBtn = document.getElementById('insertTemplateBtn');
    const randomBtn = document.getElementById('randomBtn');

    const LS_KEY = 'mini-html-runner-content-retro';
    const DEFAULT_SNIPPET = ''; // start EMPTY

    // Load saved or default content (empty on first load)
    const saved = localStorage.getItem(LS_KEY);
    editor.value = saved !== null ? saved : DEFAULT_SNIPPET;

    // Autosave
    editor.addEventListener('input', () => {
      try { localStorage.setItem(LS_KEY, editor.value); } catch(e) {}
    });

    function openInNewTab(html) {
      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const w = window.open(url, '_blank', 'noopener');
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      if (!w) alert('Popup blocked. Please allow popups for this site.');
    }

    runBtn.addEventListener('click', () => openInNewTab(editor.value));

    // Keyboard shortcut: Ctrl/Cmd + Enter
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        openInNewTab(editor.value);
      }
    });

    resetBtn.addEventListener('click', () => {
      if (confirm('Clear the editor?')) {
        editor.value = '';
        localStorage.setItem(LS_KEY, editor.value);
      }
    });

    downloadBtn.addEventListener('click', () => {
      const blob = new Blob([editor.value], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'page.html';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    insertTemplateBtn.addEventListener('click', () => {
      const TEMPLATE =
`<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Blank Retro Page</title>
    <style>body{font-family:"Times New Roman",serif;margin:30px;background:#fdfdf6}</style>
  </head>
  <body>
    <h1>Hello (retro)</h1>
    <p>Start typing your HTML here…</p>
  </body>
</html>`;
      const { selectionStart: s, selectionEnd: e } = editor;
      editor.setRangeText(TEMPLATE, s, e, 'select');
      editor.focus();
      editor.dispatchEvent(new Event('input'));
    });

    // === 10 Retro Mini-Games (each a full HTML you can run standalone) ===
    const GAMES = [
      {name:'Snake', html:
`<!doctype html><html><head><meta charset=utf-8><title>Snake (1999)</title>
<style>body{margin:0;background:#000;color:#0f0;font:16px Courier}#c{display:block;margin:20px auto;border:2px solid #0f0;background:#001}</style></head>
<body><canvas id=c width=400 height=400></canvas><script>
const ctx=c.getContext('2d');let gs=20, vx=1, vy=0, px=10, py=10, ax=15, ay=15, trail=[], tail=5, score=0;
onkeydown=e=>{if(e.key=='ArrowLeft'&&vx!=1){vx=-1;vy=0}if(e.key=='ArrowUp'&&vy!=1){vx=0;vy=-1}if(e.key=='ArrowRight'&&vx!=-1){vx=1;vy=0}if(e.key=='ArrowDown'&&vy!=-1){vx=0;vy=1}}
function rnd(n){return (Math.random()*n)|0}
function loop(){
  px+=vx; py+=vy;
  if(px<0)px=19;if(px>19)px=0;if(py<0)py=19;if(py>19)py=0;
  ctx.fillStyle='#000';ctx.fillRect(0,0,400,400);
  ctx.fillStyle='#0f0';for(let t of trail){ctx.fillRect(t.x*gs,t.y*gs,gs-2,gs-2)}
  trail.push({x:px,y:py}); while(trail.length>tail)trail.shift();
  for(let i=0;i<trail.length-1;i++){if(trail[i].x==px&&trail[i].y==py){tail=5;score=0}}
  ctx.fillStyle='#f00';ctx.fillRect(ax*gs,ay*gs,gs-2,gs-2);
  if(ax==px&&ay==py){tail++;score++;ax=rnd(20);ay=rnd(20)}
  ctx.fillStyle='#0f0';ctx.fillText('Score: '+score,10,16);
}
setInterval(loop,100);
<\/script></body></html>`},

      {name:'Pong', html:
`<!doctype html><html><head><meta charset=utf-8><title>Pong (1999)</title>
<style>body{margin:0;background:#111;color:#0f0;font:16px Courier}#c{display:block;margin:20px auto;border:2px solid #0f0;background:#000}</style></head>
<body><canvas id=c width=500 height=300></canvas><script>
const x=c.getContext('2d');let pY=120,aY=120,by=150,bx=250, vx=3, vy=2, score=0;
onmousemove=e=>pY=Math.max(0,Math.min(240,e.clientY-c.getBoundingClientRect().top-30));
function loop(){
  x.fillStyle='#000';x.fillRect(0,0,500,300);
  // paddles
  x.fillStyle='#0f0';x.fillRect(10,pY,10,60); // player
  // AI follows ball
  aY+=(by-30-aY)*0.07; x.fillRect(480,aY,10,60);
  // ball
  bx+=vx; by+=vy;
  if(by<5||by>295)vy*=-1;
  // collide player
  if(bx<22&&by>pY&&by<pY+60){vx*=-1;bx=22;score++}
  // collide AI
  if(bx>478&&by>aY&&by<aY+60){vx*=-1;bx=478}
  // reset
  if(bx<0||bx>500){bx=250;by=150;vx=3*Math.sign(-vx);vy=2}
  x.fillStyle='#0f0';x.fillRect(bx-4,by-4,8,8);
  x.fillText('Score: '+score,10,15);
  requestAnimationFrame(loop);
}
loop();
<\/script></body></html>`},

      {name:'Breakout', html:
`<!doctype html><html><head><meta charset=utf-8><title>Breakout (1999)</title>
<style>body{margin:0;background:#001;color:#0f0;font:16px Courier}#c{display:block;margin:20px auto;border:2px solid #0f0;background:#000}</style></head>
<body><canvas id=c width=480 height=320></canvas><script>
const ctx=c.getContext('2d');let x=240,y=200,vx=2,vy=-2,pX=200,score=0;
let bricks=[];for(let r=0;r<5;r++){for(let c2=0;c2<8;c2++){bricks.push({x:10+c2*58,y:20+r*20,w:50,h:10,alive:true})}}
onmousemove=e=>pX=Math.max(0,Math.min(400,e.clientX-c.getBoundingClientRect().left-40));
function loop(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,480,320);
  // ball
  x+=vx;y+=vy;
  if(x<4||x>476)vx*=-1;if(y<4)vy*=-1;if(y>316){x=240;y=200;vy=-2;score=0}
  ctx.fillStyle='#0f0';ctx.fillRect(x-4,y-4,8,8);
  // paddle
  ctx.fillRect(pX,300,80,8);
  if(y>292&&x>pX&&x<pX+80){vy*=-1;y=292}
  // bricks
  ctx.fillStyle='#0a4';
  for(const b of bricks){
    if(!b.alive)continue;
    ctx.fillRect(b.x,b.y,b.w,b.h);
    if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){b.alive=false;vy*=-1;score++}
  }
  ctx.fillStyle='#0f0';ctx.fillText('Score: '+score,10,16);
  requestAnimationFrame(loop);
}
loop();
<\/script></body></html>`},

      {name:'Flappy Dot', html:
`<!doctype html><html><head><meta charset=utf-8><title>Flappy Dot (1999)</title>
<style>body{margin:0;background:#113;color:#0f0;font:16px Courier}#c{display:block;margin:20px auto;border:2px solid #0f0;background:#001}</style></head>
<body><canvas id=c width=400 height=300></canvas><script>
const g=c.getContext('2d');let y=150,vy=0,pipes=[],t=0,score=0;onkeydown=()=>vy=-4;
function add(){let gap=80, top=20+Math.random()*140; pipes.push({x:400,top:top,bottom:top+gap});}
function loop(){
  t++; if(t%100==0)add();
  vy+=0.2; y+=vy; if(y<0||y>300){y=150;vy=0;pipes=[];score=0}
  g.fillStyle='#001';g.fillRect(0,0,400,300);
  g.fillStyle='#0f0';g.beginPath();g.arc(60,y,6,0,7);g.fill();
  for(const p of pipes){p.x-=2; g.fillStyle='#0a4';g.fillRect(p.x,0,25,p.top);g.fillRect(p.x,p.bottom,25,300-p.bottom);
    if(p.x==60)score++;
    if(60>p.x&&60<p.x+25 && (y<p.top||y>p.bottom)){y=150;vy=0;pipes=[];score=0}}
  g.fillStyle='#0f0';g.fillText('Score: '+score,10,16);
  requestAnimationFrame(loop);
}
loop();
<\/script></body></html>`},

      {name:'Dodge Rain', html:
`<!doctype html><html><head><meta charset=utf-8><title>Dodge Rain (1999)</title>
<style>body{margin:0;background:#000;color:#0f0;font:16px Courier}#c{display:block;margin:20px auto;border:2px solid #0f0;background:#111}</style></head>
<body><canvas id=c width=400 height=400></canvas><script>
const k=c.getContext('2d');let x=200,y=360,keys={},drops=[],alive=true,score=0;
onkeydown=e=>keys[e.key]=1;onkeyup=e=>keys[e.key]=0;
function loop(){
  if(!alive && keys[' ']){alive=true;score=0;drops=[]}
  if(alive){
    if(keys['ArrowLeft'])x-=4;if(keys['ArrowRight'])x+=4;x=Math.max(10,Math.min(390,x));
    if(Math.random()<0.07)drops.push({x:Math.random()*400,y:-10,v:2+Math.random()*3});
    for(const d of drops){d.y+=d.v; if(Math.hypot(d.x-x,d.y-y)<10)alive=false}
    drops=drops.filter(d=>d.y<420); score++;
  }
  k.fillStyle='#111';k.fillRect(0,0,400,400);
  k.fillStyle='#0f0';k.fillRect(x-10,y-10,20,20);
  k.fillStyle='#0cf';for(const d of drops)k.fillRect(d.x-2,d.y-6,4,12);
  k.fillStyle='#0f0';k.fillText(alive?'Score: '+(score|0):'Game Over - press Space',10,16);
  requestAnimationFrame(loop);
}
loop();
<\/script></body></html>`},

      {name:'Space Shooter', html:
`<!doctype html><html><head><meta charset=utf-8><title>Space Shooter (1999)</title>
<style>body{margin:0;background:#000;color:#0f0;font:16px Courier}#c{display:block;margin:20px auto;border:2px solid #0f0;background:#000}</style></head>
<body><canvas id=c width=400 height=400></canvas><script>
const q=c.getContext('2d');let x=200,y=340,keys={},shots=[],foes=[],t=0,score=0,alive=true;
onkeydown=e=>{keys[e.key]=1;if(e.key===' ')shots.push({x:x,y:y-10})};onkeyup=e=>keys[e.key]=0;
function loop(){
  if(!alive && keys[' ']){alive=true;score=0;shots=[];foes=[]}
  t++; if(t%50==0)foes.push({x:20+Math.random()*360,y:-10,v:1+Math.random()*1.5});
  if(alive){
    if(keys['ArrowLeft'])x-=4;if(keys['ArrowRight'])x+=4;x=Math.max(10,Math.min(390,x));
    for(const s of shots)s.y-=6; shots=shots.filter(s=>s.y>-10);
    for(const f of foes){f.y+=f.v;if(Math.hypot(f.x-x,f.y-y)<14)alive=false}
    // collisions
    for(const s of shots){for(const f of foes){if(Math.hypot(f.x-s.x,f.y-s.y)<10){f.hit=true;s.y=-99;score+=10}}}
    foes=foes.filter(f=>!f.hit&&f.y<420);
  }
  // draw
  q.fillStyle='#000';q.fillRect(0,0,400,400);
  q.fillStyle='#0f0';q.fillRect(x-10,y-10,20,20);
  q.fillStyle='#ff0';for(const s of shots)q.fillRect(s.x-2,s.y-6,4,8);
  q.fillStyle='#f00';for(const f of foes)q.fillRect(f.x-8,f.y-8,16,16);
  q.fillStyle='#0f0';q.fillText(alive?'Score: '+score:'Crashed - Space to restart',10,16);
  requestAnimationFrame(loop);
}
loop();
<\/script></body></html>`},

      {name:'Memory Match', html:
`<!doctype html><html><head><meta charset=utf-8><title>Memory Match (1999)</title>
<style>body{margin:0;background:#021;color:#0f0;font:16px Courier}#c{display:block;margin:20px auto;border:2px solid #0f0;background:#001}</style></head>
<body><canvas id=c width=400 height=400></canvas><script>
const w=c.getContext('2d');let cards=[],sel=[],found=0;const N=8;let vals=[...Array(N).keys(),...Array(N).keys()].flat();
vals.sort(()=>Math.random()-0.5); for(let i=0;i<16;i++){cards.push({v:vals[i],open:false,x:20+(i%4)*95,y:20+(i/4|0)*95})}
c.onclick=e=>{const r=c.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  for(const card of cards){if(mx>card.x&&mx<card.x+80&&my>card.y&&my<card.y+80&&!card.open && sel.length<2){card.open=true;sel.push(card)}}
  if(sel.length==2){setTimeout(()=>{if(sel[0].v==sel[1].v){found+=2}else{sel[0].open=sel[1].open=false} sel=[];},500)}
}
function draw(){
 w.fillStyle='#001';w.fillRect(0,0,400,400);
 for(const card of cards){
   w.fillStyle=card.open?'#0a4':'#044';w.fillRect(card.x,card.y,80,80);
   if(card.open){w.fillStyle='#fff';w.fillText(card.v,card.x+36,card.y+44)}
 }
 w.fillStyle='#0f0';w.fillText('Found: '+found+'/16',10,16);
 requestAnimationFrame(draw);
}draw();
<\/script></body></html>`},

      {name:'Brick Stacker', html:
`<!doctype html><html><head><meta charset=utf-8><title>Brick Stacker (1999)</title>
<style>body{margin:0;background:#000;color:#0f0;font:16px Courier}#c{display:block;margin:20px auto;border:2px solid #0f0;background:#001}</style></head>
<body><canvas id=c width=300 height=400></canvas><script>
const d=c.getContext('2d');let level=0, dir=1, x=0, w=80, stack=[{x:110,w:80,y:380}], speed=2, moving=true;
onkeydown=()=>{if(!moving)return; const top=stack[stack.length-1];
  const overlap = Math.min(x+w, top.x+top.w)-Math.max(x, top.x);
  if(overlap<=0){moving=false}else{
    x=Math.max(x,top.x); w=overlap; stack.push({x:x,y:380- (stack.length*10), w}); level++; speed+=0.1; if(level>20)moving=false;
  }}
function loop(){
  if(moving){ x+=dir*speed; if(x<0||x+w>300){dir*=-1;x+=dir*speed}}
  d.fillStyle='#001';d.fillRect(0,0,300,400);
  // draw stack
  d.fillStyle='#0a4'; for(const b of stack) d.fillRect(b.x,b.y,b.w,10);
  // moving
  if(moving){ d.fillStyle='#0f0'; d.fillRect(x,380-stack.length*10,w,10); }
  d.fillStyle='#0f0'; d.fillText(moving?'Space: drop':'Game Over - refresh',10,16);
  requestAnimationFrame(loop);
}loop();
<\/script></body></html>`},

      {name:'Asteroids Lite', html:
`<!doctype html><html><head><meta charset=utf-8><title>Asteroids Lite (1999)</title>
<style>body{margin:0;background:#000;color:#0f0;font:16px Courier}#c{display:block;margin:20px auto;border:2px solid #0f0;background:#000}</style></head>
<body><canvas id=c width=500 height=400></canvas><script>
const a=c.getContext('2d');let ship={x:250,y:200,dx:0,dy:0,ang:0},keys={},rocks=[],shots=[],score=0;
onkeydown=e=>{keys[e.key]=1;if(e.key===' ')shots.push({x:ship.x,y:ship.y,dx:Math.cos(ship.ang)*5,dy:Math.sin(ship.ang)*5,t:60})};
onkeyup=e=>keys[e.key]=0;
for(let i=0;i<6;i++)rocks.push({x:Math.random()*500,y:Math.random()*400,dx:Math.random()*2-1,dy:Math.random()*2-1,r:12+Math.random()*18});
function loop(){
  // control
  if(keys['ArrowLeft'])ship.ang-=0.07;if(keys['ArrowRight'])ship.ang+=0.07;
  if(keys['ArrowUp']){ship.dx+=Math.cos(ship.ang)*0.2;ship.dy+=Math.sin(ship.ang)*0.2}
  ship.x=(ship.x+ship.dx+500)%500; ship.y=(ship.y+ship.dy+400)%400; ship.dx*=0.99; ship.dy*=0.99;
  // move rocks
  for(const r of rocks){r.x=(r.x+r.dx+500)%500;r.y=(r.y+r.dy+400)%400}
  // shots
  for(const s of shots){s.x+=s.dx;s.y+=s.dy;s.t--} shots=shots.filter(s=>s.t>0);
  // collisions
  for(const s of shots){for(const r of rocks){if(Math.hypot(s.x-r.x,s.y-r.y)<r.r){r.hit=true;s.t=0;score+=10}}}
  rocks=rocks.flatMap(r=>r.hit? (r.r>10?[{x:r.x,y:r.y,dx:r.dx+0.7,dy:r.dy-0.2,r:r.r/2},{x:r.x,y:r.y,dx:r.dx-0.7,dy:r.dy+0.2,r:r.r/2}]:[]):[r]);
